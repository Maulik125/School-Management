<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add School</title>
</head>
<body>
    <h2>Add School</h2>
  <form id="schoolForm">
    <input placeholder="Name" name="name" required /><br />
    <input placeholder="Address" name="address" required /><br />
    <input type="number" step="any" placeholder="Latitude" name="latitude" required /><br />
    <input type="number" step="any" placeholder="Longitude" name="longitude" required /><br />
    <button type="submit">Add School</button>
  </form>
  <script>
        document.getElementById("schoolForm").addEventListener("submit", async function (e) {
          e.preventDefault();
          const form = new FormData(e.target);
          const body = {};
          form.forEach((val, key) => body[key] = val);
          await fetch("/addSchool", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          alert("School Added");
        });
    
  </script>
</body>
</html>
